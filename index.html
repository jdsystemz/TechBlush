<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechBlush</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">
        ✨ TechBlush
    </div>

    <div class="header-right">
        <div class="wishlist-counter">
            ❤️ <span id="wishlistCount">0</span>
        </div>

        <div class="cart-button">
            🛒 <span id="cartCount">0</span>
        </div>
    </div>
</header>

<section class="hero">
    <div class="hero-content">
        <img
            class="hero-logo"
            src="https://raw.githubusercontent.com/jdsystemz/TechBlush/main/Designer.png"
            alt="TechBlush Logo"
        >
        <div class="hero-text">
            <h1>Cute Tech For Every Setup 💖</h1>
            <p>Discover stylish IT gadgets and accessories.</p>
        </div>
    </div>
</section>

<section class="filters">

    <input
        type="text"
        id="search"
        placeholder="🔍 Search products..."
    >

    <select id="category">
        <option value="All">All Categories</option>
        <option value="Keyboard">Keyboard</option>
        <option value="Accessory">Accessory</option>
        <option value="Electronics">Electronics</option>
    </select>

    <select id="sort">
        <option value="default">Sort Products</option>
        <option value="priceLow">Price ↑</option>
        <option value="priceHigh">Price ↓</option>
        <option value="rating">Top Rated</option>
    </select>

</section>

<section id="products" class="products"></section>

<div class="cart-sidebar">

    <h2>🛒 Shopping Cart</h2>

    <br><hr><br>

    <div id="cartItems"></div>

    <div class="promo">
        <input
            id="promoCode"
            placeholder="Promo Code"
        >

        <button onclick="applyPromo()">
            Apply
        </button>
    </div>

    <div class="cart-footer">
        <h3>Total: $<span id="total">0</span></h3>

        <button class="checkout">
            Checkout
        </button>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
